# MedicSeba test server behind Cloudflare.
# Port 80 serves Cloudflare's "Flexible" SSL mode, port 443 with a self-signed certificate serves "Full".
server {
  listen 80;
  listen 443 ssl;
  server_name __DOMAIN__;
  ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
  ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

  root /opt/medicseba/web;
  index index.html;
  client_max_body_size 6m; # doctor photo uploads

  # API and the live queue socket
  location ~ ^/(v1|socket\.io|health)(/|$) {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Built app files never change name, so cache them hard
  location ~ ^(/agent)?/_expo/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Admin panel (Vite build: hashed files under /admin/assets)
  location /admin/assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /admin/ { try_files $uri /admin/index.html; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; }
  location = /admin { return 301 /admin/; }

  # Chamber counter app
  location /agent/ { try_files $uri /agent/index.html; add_header Cache-Control "no-cache"; }
  location = /agent { return 301 /agent/; }

  # Every other path is a patient app screen
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
