# MedicSeba test server. Cloudflare in front (SSL Flexible), so Nginx listens on 80.
server {
  listen 80;
  server_name __DOMAIN__;

  root /opt/medicseba/apps/patient/dist;
  index index.html;
  client_max_body_size 2m;

  # API and the live queue socket
  location ~ ^/(v1|socket\.io|health)(/|$) {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Built app files never change name, so cache them hard
  location /_expo/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Every other path is an app screen
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
