<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MedicSeba Counter</title>
    <meta name="theme-color" content="#F3F5F9" />
    <link rel="icon" href="/agent/favicon.ico" />
    <link rel="manifest" href="/agent/manifest.json" />
    <link rel="apple-touch-icon" href="/agent/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Counter" />
    <style id="expo-reset">
      html, body { height: 100%; background: #F3F5F9; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Solid strip under the phone's status bar. iPhone home screen apps blur whatever scrolls under the
         status bar unless a fixed, solid element sits at the very top; this keeps the top clean. -->
    <div id="statusbar" style="position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#F3F5F9;z-index:2147483647;pointer-events:none"></div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register("/agent/sw.js", { scope: "/agent/" }).catch(() => {}));
    </script>
  </body>
</html>
